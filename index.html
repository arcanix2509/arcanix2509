<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Arcanix Hub - Authentication</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-[100dvh] font-sans flex items-center justify-center p-3 sm:p-6 overflow-x-hidden">

  <!-- Background Glow FX -->
  <div class="fixed top-1/4 left-1/4 w-72 h-72 sm:w-96 sm:h-96 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="fixed bottom-1/4 right-1/4 w-72 h-72 sm:w-96 sm:h-96 bg-purple-600/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Loading Overlay -->
  <div id="loader" class="fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center gap-4 p-4 text-center">
    <div class="w-12 h-12 border-4 border-cyan-500/20 border-t-cyan-400 rounded-full animate-spin"></div>
    <p class="text-xs sm:text-sm text-cyan-400 tracking-wider font-semibold animate-pulse">CONNECTING TO ARCANIX NETWORK...</p>
  </div>

  <!-- Auth Card -->
  <div class="w-full max-w-md bg-slate-900/80 border border-slate-800/90 backdrop-blur-2xl rounded-3xl p-5 sm:p-8 shadow-2xl relative z-10 my-auto">
    
    <!-- Brand Header -->
    <div class="text-center mb-6">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center font-black text-2xl mx-auto mb-3 shadow-lg shadow-cyan-500/30">A</div>
      <h1 class="text-xl sm:text-2xl font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-purple-400">ARCANIX HUB</h1>
      <p id="authSubtitle" class="text-xs text-slate-400 mt-1">Enter your credentials to access the survival network</p>
    </div>

    <!-- Alert Box -->
    <div id="alertBox" class="hidden mb-5 p-3 rounded-xl text-xs font-semibold flex items-center gap-2"></div>

    <!-- GOOGLE LOGIN / REGISTER BUTTON -->
    <button type="button" id="googleAuthBtn" class="w-full bg-slate-800/90 hover:bg-slate-800 border border-slate-700/80 text-white font-bold py-3 px-4 rounded-xl shadow-md transition active:scale-95 text-xs sm:text-sm flex items-center justify-center gap-3 mb-5">
      <svg class="w-4 h-4" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <span>Continue with Google</span>
    </button>

    <!-- DIVIDER -->
    <div class="relative flex py-2 items-center mb-5">
      <div class="flex-grow border-t border-slate-800"></div>
      <span class="flex-shrink mx-3 text-[10px] text-slate-500 font-bold uppercase tracking-widest">Or with Email</span>
      <div class="flex-grow border-t border-slate-800"></div>
    </div>

    <!-- LOGIN FORM -->
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-[11px] sm:text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Email Address</label>
        <div class="relative">
          <i class="fa-solid fa-envelope absolute left-4 top-3.5 text-slate-500 text-sm"></i>
          <input type="email" id="loginEmail" required placeholder="player@arcanix.com" 
                 class="w-full bg-slate-800/80 border border-slate-700/80 rounded-xl pl-11 pr-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 transition">
        </div>
      </div>

      <div>
        <label class="block text-[11px] sm:text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Password</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-500 text-sm"></i>
          <input type="password" id="loginPassword" required placeholder="••••••••" 
                 class="w-full bg-slate-800/80 border border-slate-700/80 rounded-xl pl-11 pr-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 transition">
        </div>
      </div>

      <div class="flex items-center justify-between text-xs pt-1">
        <label class="flex items-center gap-2 text-slate-400 cursor-pointer">
          <input type="checkbox" id="rememberMe" class="rounded bg-slate-800 border-slate-700 text-cyan-500 focus:ring-0 w-4 h-4">
          <span>Remember Me</span>
        </label>
        <button type="button" id="forgotPassBtn" class="text-cyan-400 hover:underline">Forgot Password?</button>
      </div>

      <button type="submit" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-black py-3.5 rounded-xl shadow-lg shadow-cyan-500/20 tracking-wider transition active:scale-95 text-xs sm:text-sm mt-2">
        LOG IN
      </button>

      <p class="text-center text-xs text-slate-400 mt-4">
        New survivor? <button type="button" id="showRegisterBtn" class="text-cyan-400 font-bold hover:underline">Create Account</button>
      </p>
    </form>

    <!-- REGISTER FORM -->
    <form id="registerForm" class="space-y-4 hidden">
      <div>
        <label class="block text-[11px] sm:text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Username</label>
        <div class="relative">
          <i class="fa-solid fa-user absolute left-4 top-3.5 text-slate-500 text-sm"></i>
          <input type="text" id="regUsername" required placeholder="CyberKnight" 
                 class="w-full bg-slate-800/80 border border-slate-700/80 rounded-xl pl-11 pr-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 transition">
        </div>
      </div>

      <div>
        <label class="block text-[11px] sm:text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Email Address</label>
        <div class="relative">
          <i class="fa-solid fa-envelope absolute left-4 top-3.5 text-slate-500 text-sm"></i>
          <input type="email" id="regEmail" required placeholder="player@arcanix.com" 
                 class="w-full bg-slate-800/80 border border-slate-700/80 rounded-xl pl-11 pr-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 transition">
        </div>
      </div>

      <div>
        <label class="block text-[11px] sm:text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Password</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-500 text-sm"></i>
          <input type="password" id="regPassword" required placeholder="Min. 6 characters" 
                 class="w-full bg-slate-800/80 border border-slate-700/80 rounded-xl pl-11 pr-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 transition">
        </div>
      </div>

      <button type="submit" class="w-full bg-gradient-to-r from-purple-500 to-cyan-500 hover:from-purple-400 hover:to-cyan-400 text-slate-950 font-black py-3.5 rounded-xl shadow-lg shadow-purple-500/20 tracking-wider transition active:scale-95 text-xs sm:text-sm mt-2">
        REGISTER NOW
      </button>

      <p class="text-center text-xs text-slate-400 mt-4">
        Already have an account? <button type="button" id="showLoginBtn" class="text-cyan-400 font-bold hover:underline">Log In</button>
      </p>
    </form>

  </div>

  <script type="module">
    import { auth, db } from './firebase-config.js';
    import { 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      sendPasswordResetEmail, 
      setPersistence, 
      browserLocalPersistence, 
      browserSessionPersistence, 
      onAuthStateChanged,
      GoogleAuthProvider,
      signInWithPopup
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const loader = document.getElementById('loader');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const alertBox = document.getElementById('alertBox');
    const authSubtitle = document.getElementById('authSubtitle');
    const googleAuthBtn = document.getElementById('googleAuthBtn');

    function showAlert(msg, isError = true) {
      alertBox.classList.remove('hidden', 'bg-red-500/20', 'border-red-500/30', 'text-red-400', 'bg-emerald-500/20', 'border-emerald-500/30', 'text-emerald-400');
      if (isError) {
        alertBox.classList.add('bg-red-500/20', 'border', 'border-red-500/30', 'text-red-400');
      } else {
        alertBox.classList.add('bg-emerald-500/20', 'border', 'border-emerald-500/30', 'text-emerald-400');
      }
      alertBox.innerHTML = `<i class="fa-solid ${isError ? 'fa-circle-exclamation' : 'fa-circle-check'}"></i> ${msg}`;
    }

    document.getElementById('showRegisterBtn').onclick = () => {
      loginForm.classList.add('hidden');
      registerForm.classList.remove('hidden');
      authSubtitle.innerText = "Create a new survivor account";
      alertBox.classList.add('hidden');
    };

    document.getElementById('showLoginBtn').onclick = () => {
      registerForm.classList.add('hidden');
      loginForm.classList.remove('hidden');
      authSubtitle.innerText = "Enter your credentials to access the survival network";
      alertBox.classList.add('hidden');
    };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = 'dashboard.html';
      } else {
        loader.classList.add('hidden');
      }
    });

    // SINGLE CLICK GOOGLE AUTHENTICATION
    googleAuthBtn.onclick = async () => {
      const provider = new GoogleAuthProvider();
      try {
        loader.classList.remove('hidden');
        const result = await signInWithPopup(auth, provider);
        const user = result.user;

        // Check if user already exists in Firestore
        const userDocRef = doc(db, "users", user.uid);
        const userDoc = await getDoc(userDocRef);

        if (!userDoc.exists()) {
          const username = user.displayName || user.email.split('@')[0];
          const avatarUrl = user.photoURL || `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(username)}`;

          await setDoc(userDocRef, {
            uid: user.uid,
            username: username,
            email: user.email,
            bio: "New survivor in Arcanix world.",
            avatarUrl: avatarUrl,
            level: 1,
            xp: 0,
            status: "online",
            createdAt: serverTimestamp()
          });
        }

        window.location.href = 'dashboard.html';
      } catch (err) {
        loader.classList.add('hidden');
        showAlert(err.message.replace('Firebase: ', ''));
      }
    };

    loginForm.onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const remember = document.getElementById('rememberMe').checked;

      try {
        await setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence);
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = 'dashboard.html';
      } catch (err) {
        showAlert(err.message.replace('Firebase: ', ''));
      }
    };

    registerForm.onsubmit = async (e) => {
      e.preventDefault();
      const username = document.getElementById('regUsername').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;
        const avatarUrl = `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(username)}`;

        await setDoc(doc(db, "users", user.uid), {
          uid: user.uid,
          username: username,
          email: email,
          bio: "New survivor in Arcanix world.",
          avatarUrl: avatarUrl,
          level: 1,
          xp: 0,
          status: "online",
          createdAt: serverTimestamp()
        });

        showAlert("Account created successfully! Redirecting...", false);
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);

      } catch (err) {
        showAlert(err.message.replace('Firebase: ', ''));
      }
    };

    document.getElementById('forgotPassBtn').onclick = async () => {
      const email = prompt("Enter your email address to reset password:");
      if (email) {
        try {
          await sendPasswordResetEmail(auth, email);
          showAlert("Password reset link sent to your email!", false);
        } catch (err) {
          showAlert(err.message.replace('Firebase: ', ''));
        }
      }
    };
  </script>
</body>
</html>
