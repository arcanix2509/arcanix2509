<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Arcanix Hub - Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-[100dvh] font-sans flex flex-col pb-20 sm:pb-0">

  <!-- Background Glow FX -->
  <div class="fixed top-1/4 left-1/4 w-72 h-72 sm:w-96 sm:h-96 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="fixed bottom-1/4 right-1/4 w-72 h-72 sm:w-96 sm:h-96 bg-purple-600/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Loading Screen -->
  <div id="loader" class="fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center gap-4">
    <div class="w-12 h-12 border-4 border-cyan-500/20 border-t-cyan-400 rounded-full animate-spin"></div>
    <p class="text-xs sm:text-sm text-cyan-400 tracking-wider font-semibold animate-pulse">LOADING PROFILE...</p>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-5 right-5 z-50 hidden bg-slate-800/95 border border-cyan-500/40 text-cyan-400 text-xs font-bold px-4 py-3 rounded-2xl shadow-xl backdrop-blur-md flex items-center gap-2 transition-all">
    <i class="fa-solid fa-circle-check text-emerald-400"></i>
    <span id="toastMsg">Action Successful!</span>
  </div>

  <!-- Navbar -->
  <nav class="border-b border-slate-800/80 bg-slate-900/90 backdrop-blur-md sticky top-0 z-40 px-4 sm:px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="dashboard.html" class="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center font-black text-lg shadow-lg shadow-cyan-500/20">A</a>
      <span class="font-black text-base sm:text-lg bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-purple-400 tracking-wider">ARCANIX</span>
    </div>
    
    <div class="hidden sm:flex items-center gap-3">
      <a href="dashboard.html" class="px-3.5 py-1.5 text-xs font-bold text-slate-300 hover:text-white bg-slate-800/80 hover:bg-slate-800 rounded-xl transition flex items-center gap-2">
        <i class="fa-solid fa-arrow-left"></i> Dashboard
      </a>
      <button id="logoutBtn" class="px-3.5 py-1.5 text-xs font-bold text-red-400 hover:text-red-300 bg-red-500/10 hover:bg-red-500/20 rounded-xl transition flex items-center gap-2 border border-red-500/20">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </button>
    </div>

    <button id="mobileLogoutBtn" class="sm:hidden w-8 h-8 flex items-center justify-center text-red-400 bg-red-500/10 rounded-lg border border-red-500/20">
      <i class="fa-solid fa-right-from-bracket text-xs"></i>
    </button>
  </nav>

  <!-- Main Content -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-3 sm:p-6 lg:p-8 relative z-10">
    
    <div class="bg-slate-900/80 border border-slate-800/90 backdrop-blur-2xl rounded-3xl p-5 sm:p-8 shadow-2xl relative overflow-hidden mb-6">
      <div class="flex flex-col sm:flex-row items-center sm:items-start gap-5 sm:gap-6 relative z-10">
        
        <div class="relative">
          <div class="w-24 h-24 sm:w-32 sm:h-32 rounded-2xl bg-slate-800 border-2 border-cyan-500/50 overflow-hidden shadow-xl shadow-cyan-500/10">
            <img id="profileAvatar" src="" alt="Avatar" class="w-full h-full object-cover">
          </div>
          <span class="absolute -bottom-2 -right-2 bg-slate-900 text-cyan-400 text-[10px] sm:text-xs font-black px-2.5 py-1 rounded-lg border border-cyan-500/30">
            LVL <span id="userLevel">1</span>
          </span>
        </div>

        <div class="flex-1 text-center sm:text-left space-y-2 w-full">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h1 id="userUsername" class="text-xl sm:text-3xl font-black text-white tracking-wide">Loading...</h1>
              <p id="userEmail" class="text-xs text-slate-400">loading@arcanix.com</p>
            </div>
            <button id="editProfileBtn" class="w-full sm:w-auto px-4 py-2 text-xs font-bold text-cyan-400 bg-cyan-500/10 hover:bg-cyan-500/20 rounded-xl transition border border-cyan-500/30 flex items-center justify-center gap-2">
              <i class="fa-solid fa-pen-to-square"></i> Edit Profile
            </button>
          </div>

          <div class="pt-1">
            <div class="inline-flex items-center gap-2 bg-slate-950/80 border border-cyan-500/20 px-3 py-1.5 rounded-xl max-w-full">
              <i class="fa-solid fa-id-card text-cyan-400 text-xs shrink-0"></i>
              <span class="text-[10px] font-bold text-slate-400 shrink-0">UID:</span>
              <span id="userUid" class="text-[11px] font-mono text-cyan-300 font-bold truncate select-all">Loading...</span>
              <button id="copyUidBtn" title="Copy UID" class="text-xs text-slate-400 hover:text-cyan-400 transition ml-1 shrink-0 active:scale-90">
                <i class="fa-solid fa-copy"></i>
              </button>
            </div>
          </div>

          <p id="userBio" class="text-xs sm:text-sm text-slate-300 italic pt-1">"New survivor in Arcanix world."</p>

          <div class="pt-3">
            <div class="flex justify-between text-[11px] sm:text-xs font-bold text-slate-400 mb-1">
              <span>XP PROGRESS</span>
              <span><span id="userXp">0</span> / 100 XP</span>
            </div>
            <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden border border-slate-700/50">
              <div id="xpBar" class="h-full bg-gradient-to-r from-cyan-500 to-purple-500 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- Edit Profile Modal -->
    <div id="editModal" class="hidden bg-slate-900/90 border border-slate-800 backdrop-blur-2xl rounded-3xl p-5 sm:p-6 shadow-2xl mb-6">
      <h2 class="text-base sm:text-lg font-black text-white mb-4 flex items-center gap-2">
        <i class="fa-solid fa-user-gear text-cyan-400"></i> Edit Profile Details
      </h2>
      <form id="editForm" class="space-y-4">
        <div>
          <label class="block text-[11px] sm:text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Username</label>
          <input type="text" id="editUsername" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-2.5 text-xs sm:text-sm text-white focus:outline-none focus:border-cyan-400 transition" placeholder="Your username">
        </div>

        <div>
          <label class="block text-[11px] sm:text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Bio</label>
          <textarea id="editBio" rows="3" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl p-3 text-xs sm:text-sm text-white focus:outline-none focus:border-cyan-400 transition" placeholder="Tell something about yourself..."></textarea>
        </div>

        <div>
          <label class="block text-[11px] sm:text-xs font-bold text-cyan-400 uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
            <i class="fa-solid fa-link"></i> Direct Image URL (PFP)
          </label>
          <input type="url" id="editAvatarUrl" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-2.5 text-xs sm:text-sm text-white focus:outline-none focus:border-cyan-400 transition placeholder-slate-500" placeholder="https://example.com/my-photo.png">
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="cancelEditBtn" class="flex-1 sm:flex-none px-4 py-2 text-xs font-bold text-slate-400 hover:text-white bg-slate-800 rounded-xl transition">Cancel</button>
          <button type="submit" class="flex-1 sm:flex-none px-5 py-2 text-xs font-black bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 rounded-xl shadow-lg shadow-cyan-500/20 transition">Save Changes</button>
        </div>
      </form>
    </div>

  </main>

  <script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const loader = document.getElementById('loader');
    const editModal = document.getElementById('editModal');
    const editBtn = document.getElementById('editProfileBtn');
    const toast = document.getElementById('toast');
    let currentUser = null;

    const urlParams = new URLSearchParams(window.location.search);
    const targetUid = urlParams.get('uid');

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        const profileUidToFetch = targetUid ? targetUid : user.uid;
        const isSelf = (!targetUid || targetUid === user.uid);

        await loadUserData(profileUidToFetch, isSelf);
        loader.classList.add('hidden');
      } else {
        window.location.href = 'index.html';
      }
    });

    async function loadUserData(uid, isSelf) {
      try {
        const userRef = doc(db, "users", uid);
        const userSnap = await getDoc(userRef);

        if (userSnap.exists()) {
          const data = userSnap.data();
          const uname = data.username || 'Survivor';

          // Auto-fix: Ensure lowercase field exists in database
          if (isSelf && (!data.username_lowercase || data.username_lowercase !== uname.toLowerCase())) {
            updateDoc(userRef, { username_lowercase: uname.toLowerCase() });
          }

          document.getElementById('userUsername').innerText = uname;
          document.getElementById('userEmail').innerText = isSelf ? (data.email || currentUser.email) : '••••••••@arcanix.com';
          document.getElementById('userBio').innerText = `"${data.bio || 'New survivor in Arcanix world.'}"`;
          document.getElementById('userUid').innerText = uid;
          
          const avatarUrl = data.avatarUrl || `https://api.dicebear.com/7.x/bottts/svg?seed=${uname}`;
          document.getElementById('profileAvatar').src = avatarUrl;
          document.getElementById('userLevel').innerText = data.level || 1;
          
          const xp = data.xp || 0;
          document.getElementById('userXp').innerText = xp;
          document.getElementById('xpBar').style.width = `${Math.min(xp, 100)}%`;

          if (!isSelf) {
            editBtn.classList.add('hidden');
          } else {
            editBtn.classList.remove('hidden');
            document.getElementById('editUsername').value = uname;
            document.getElementById('editBio').value = data.bio || '';
            if (data.avatarUrl && !data.avatarUrl.includes('dicebear.com')) {
              document.getElementById('editAvatarUrl').value = data.avatarUrl;
            }
          }
        } else {
          alert("Profile not found!");
          window.location.href = 'dashboard.html';
        }
      } catch (err) {
        console.error("Error fetching user data:", err);
      }
    }

    document.getElementById('copyUidBtn').onclick = () => {
      const uidText = document.getElementById('userUid').innerText;
      if (uidText && uidText !== 'Loading...') {
        navigator.clipboard.writeText(uidText).then(() => {
          showToast("UID copied to clipboard!");
        });
      }
    };

    function showToast(msg) {
      document.getElementById('toastMsg').innerText = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 2500);
    }

    editBtn.onclick = () => editModal.classList.toggle('hidden');
    document.getElementById('cancelEditBtn').onclick = () => editModal.classList.add('hidden');

    document.getElementById('editForm').onsubmit = async (e) => {
      e.preventDefault();
      const newUname = document.getElementById('editUsername').value.trim() || 'Survivor';
      const newBio = document.getElementById('editBio').value.trim();
      const directUrl = document.getElementById('editAvatarUrl').value.trim();

      try {
        const userRef = doc(db, "users", currentUser.uid);
        const updateData = { 
          username: newUname,
          username_lowercase: newUname.toLowerCase(),
          bio: newBio 
        };

        if (directUrl) {
          updateData.avatarUrl = directUrl;
        }

        await updateDoc(userRef, updateData);
        await loadUserData(currentUser.uid, true);
        editModal.classList.add('hidden');
        showToast("Profile updated!");
      } catch (err) {
        alert("Failed to update profile: " + err.message);
      }
    };

    const handleLogout = () => signOut(auth).then(() => window.location.href = 'index.html');
    document.getElementById('logoutBtn').onclick = handleLogout;
    document.getElementById('mobileLogoutBtn').onclick = handleLogout;
  </script>
</body>
</html>
