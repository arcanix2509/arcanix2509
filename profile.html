<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcanix Hub - Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col">

  <!-- Background Glow FX -->
  <div class="fixed top-1/4 left-1/4 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="fixed bottom-1/4 right-1/4 w-96 h-96 bg-purple-600/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Loading Screen -->
  <div id="loader" class="fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center gap-4">
    <div class="w-12 h-12 border-4 border-cyan-500/20 border-t-cyan-400 rounded-full animate-spin"></div>
    <p class="text-sm text-cyan-400 tracking-wider font-semibold animate-pulse">LOADING SURVIVOR PROFILE...</p>
  </div>

  <!-- Navbar -->
  <nav class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-40 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="dashboard.html" class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center font-black text-xl shadow-lg shadow-cyan-500/20">A</a>
      <span class="font-black text-lg bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-purple-400 tracking-wider">ARCANIX</span>
    </div>
    <div class="flex items-center gap-4">
      <a href="dashboard.html" class="px-4 py-2 text-xs font-bold text-slate-300 hover:text-white bg-slate-800/80 hover:bg-slate-800 rounded-xl transition flex items-center gap-2">
        <i class="fa-solid fa-arrow-left"></i> Dashboard
      </a>
      <button id="logoutBtn" class="px-4 py-2 text-xs font-bold text-red-400 hover:text-red-300 bg-red-500/10 hover:bg-red-500/20 rounded-xl transition flex items-center gap-2 border border-red-500/20">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </button>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 sm:p-6 lg:p-8 relative z-10">
    
    <!-- Profile Header Card -->
    <div class="bg-slate-900/80 border border-slate-800 backdrop-blur-2xl rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden mb-6">
      <div class="flex flex-col sm:flex-row items-center sm:items-start gap-6 relative z-10">
        
        <!-- Avatar Container -->
        <div class="relative group">
          <div class="w-28 h-28 sm:w-32 sm:h-32 rounded-2xl bg-slate-800 border-2 border-cyan-500/50 overflow-hidden shadow-xl shadow-cyan-500/10">
            <img id="profileAvatar" src="" alt="Avatar" class="w-full h-full object-cover">
          </div>
          <span class="absolute -bottom-2 -right-2 bg-slate-900 text-cyan-400 text-xs font-black px-2.5 py-1 rounded-lg border border-cyan-500/30">
            LVL <span id="userLevel">1</span>
          </span>
        </div>

        <!-- User Info -->
        <div class="flex-1 text-center sm:text-left space-y-2">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <div>
              <h1 id="userUsername" class="text-2xl sm:text-3xl font-black text-white tracking-wide">Loading...</h1>
              <p id="userEmail" class="text-xs text-slate-400">loading@arcanix.com</p>
            </div>
            <button id="editProfileBtn" class="px-4 py-2 text-xs font-bold text-cyan-400 bg-cyan-500/10 hover:bg-cyan-500/20 rounded-xl transition border border-cyan-500/30 flex items-center justify-center gap-2">
              <i class="fa-solid fa-pen-to-square"></i> Edit Profile
            </button>
          </div>

          <p id="userBio" class="text-sm text-slate-300 italic pt-2">"New survivor in Arcanix world."</p>

          <!-- XP Progress Bar -->
          <div class="pt-3">
            <div class="flex justify-between text-xs font-bold text-slate-400 mb-1">
              <span>XP PROGRESS</span>
              <span><span id="userXp">0</span> / 100 XP</span>
            </div>
            <div class="w-full h-2.5 bg-slate-800 rounded-full overflow-hidden border border-slate-700/50">
              <div id="xpBar" class="h-full bg-gradient-to-r from-cyan-500 to-purple-500 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- Edit Profile Modal / Form (Hidden by default) -->
    <div id="editModal" class="hidden bg-slate-900/90 border border-slate-800 backdrop-blur-2xl rounded-3xl p-6 shadow-2xl mb-6">
      <h2 class="text-lg font-black text-white mb-4 flex items-center gap-2">
        <i class="fa-solid fa-user-gear text-cyan-400"></i> Edit Profile Details
      </h2>
      <form id="editForm" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Bio</label>
          <textarea id="editBio" rows="3" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-cyan-400 transition" placeholder="Tell something about yourself..."></textarea>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Avatar Seed (Style Keyword)</label>
          <input type="text" id="editAvatarSeed" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-400 transition" placeholder="Type anything to change avatar design">
        </div>

        <div class="flex justify-end gap-3 pt-2">
          <button type="button" id="cancelEditBtn" class="px-4 py-2 text-xs font-bold text-slate-400 hover:text-white bg-slate-800 rounded-xl transition">Cancel</button>
          <button type="submit" class="px-5 py-2 text-xs font-black bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 rounded-xl shadow-lg shadow-cyan-500/20 transition">Save Changes</button>
        </div>
      </form>
    </div>

  </main>

  <!-- Firebase Script -->
  <script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const loader = document.getElementById('loader');
    const editModal = document.getElementById('editModal');
    let currentUser = null;

    // Auth State Check
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        await loadUserData(user.uid);
        loader.classList.add('hidden');
      } else {
        window.location.href = 'index.html';
      }
    });

    // Load User Data from Firestore
    async function loadUserData(uid) {
      try {
        const userRef = doc(db, "users", uid);
        const userSnap = await getDoc(userRef);

        if (userSnap.exists()) {
          const data = userSnap.data();
          document.getElementById('userUsername').innerText = data.username || 'Survivor';
          document.getElementById('userEmail').innerText = data.email || currentUser.email;
          document.getElementById('userBio').innerText = `"${data.bio || 'New survivor in Arcanix world.'}"`;
          document.getElementById('profileAvatar').src = data.avatarUrl || `https://api.dicebear.com/7.x/bottts/svg?seed=${data.username}`;
          document.getElementById('userLevel').innerText = data.level || 1;
          
          const xp = data.xp || 0;
          document.getElementById('userXp').innerText = xp;
          document.getElementById('xpBar').style.width = `${Math.min(xp, 100)}%`;

          // Fill edit inputs
          document.getElementById('editBio').value = data.bio || '';
        }
      } catch (err) {
        console.error("Error fetching user data:", err);
      }
    }

    // Toggle Edit Form
    document.getElementById('editProfileBtn').onclick = () => {
      editModal.classList.toggle('hidden');
    };

    document.getElementById('cancelEditBtn').onclick = () => {
      editModal.classList.add('hidden');
    };

    // Save Profile Updates
    document.getElementById('editForm').onsubmit = async (e) => {
      e.preventDefault();
      const newBio = document.getElementById('editBio').value.trim();
      const avatarSeed = document.getElementById('editAvatarSeed').value.trim();

      try {
        const userRef = doc(db, "users", currentUser.uid);
        const updateData = { bio: newBio };

        if (avatarSeed) {
          updateData.avatarUrl = `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(avatarSeed)}`;
        }

        await updateDoc(userRef, updateData);
        await loadUserData(currentUser.uid);
        editModal.classList.add('hidden');
        alert("Profile updated successfully!");
      } catch (err) {
        alert("Failed to update profile: " + err.message);
      }
    };

    // Logout
    document.getElementById('logoutBtn').onclick = async () => {
      try {
        await signOut(auth);
        window.location.href = 'index.html';
      } catch (err) {
        alert("Error logging out: " + err.message);
      }
    };
  </script>
</body>
</html>
