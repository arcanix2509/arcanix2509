<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arcanix - Global Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  
  <div class="max-w-4xl mx-auto p-4 h-screen flex flex-col">
    <!-- Header -->
    <div class="py-3 border-b border-slate-800 flex justify-between items-center">
      <h1 class="text-lg font-bold text-cyan-400">Global Survivor Chat</h1>
      <a href="dashboard.html" class="text-xs text-slate-400 hover:text-white">← Dashboard</a>
    </div>

    <!-- Messages Container -->
    <div id="messagesBox" class="flex-1 overflow-y-auto my-4 space-y-3 pr-2">
      <!-- Chat bubbles injected here -->
    </div>

    <!-- Chat Controls -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-2 flex flex-col gap-2">
      <div id="imgPreviewBar" class="hidden text-xs text-cyan-400 px-2 py-1 bg-slate-800 rounded flex justify-between">
        <span>Image Attached</span>
        <button id="clearImgBtn" class="text-red-400">Remove</button>
      </div>

      <div class="flex items-center gap-2">
        <button id="attachUrlBtn" class="p-2 text-slate-400 hover:text-cyan-400" title="Attach External Image Link">📷</button>
        <input type="text" id="msgText" placeholder="Write a message..." class="flex-1 bg-transparent border-none text-sm focus:outline-none text-white">
        <button id="sendBtn" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm transition">Send</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { collection, addDoc, serverTimestamp, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    let currentUser = null;
    let activeImageUrl = null;

    // Helper: XSS Protection
    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // Auth Guard
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = 'index.html';
      } else {
        currentUser = user;
      }
    });

    document.getElementById('attachUrlBtn').onclick = () => {
      const url = prompt("Paste external image URL (Imgur, Discord, PostImages):");
      if (url && url.startsWith('http')) {
        activeImageUrl = url;
        document.getElementById('imgPreviewBar').classList.remove('hidden');
      }
    };

    document.getElementById('clearImgBtn').onclick = () => {
      activeImageUrl = null;
      document.getElementById('imgPreviewBar').classList.add('hidden');
    };

    // Load Chat
    const q = query(collection(db, "globalChat"), orderBy("timestamp", "asc"));
    onSnapshot(q, (snapshot) => {
      const box = document.getElementById('messagesBox');
      box.innerHTML = '';
      snapshot.forEach(doc => {
        const m = doc.data();
        const isMe = currentUser && m.senderId === currentUser.uid;
        
        const safeName = escapeHtml(m.senderName || 'Player');
        const safeText = m.text ? escapeHtml(m.text) : '';
        const safeImg = m.imageUrl ? escapeHtml(m.imageUrl) : null;

        box.innerHTML += `
          <div class="flex ${isMe ? 'justify-end' : 'justify-start'}">
            <div class="max-w-xs ${isMe ? 'bg-cyan-600 text-white' : 'bg-slate-900 border border-slate-800 text-slate-200'} p-3 rounded-2xl">
              <span class="text-[10px] opacity-70 block mb-1 font-bold">${safeName}</span>
              ${safeImg ? `<img src="${safeImg}" class="rounded-lg mb-2 max-h-40 w-full object-cover">` : ''}
              ${safeText ? `<p class="text-sm">${safeText}</p>` : ''}
            </div>
          </div>`;
      });
      box.scrollTop = box.scrollHeight;
    });

    // Send Message
    document.getElementById('sendBtn').onclick = async () => {
      if (!currentUser) return;
      const text = document.getElementById('msgText').value.trim();
      if (!text && !activeImageUrl) return;

      await addDoc(collection(db, "globalChat"), {
        senderId: currentUser.uid,
        senderName: currentUser.displayName || 'Survivor',
        text: text,
        imageUrl: activeImageUrl,
        timestamp: serverTimestamp()
      });

      document.getElementById('msgText').value = '';
      activeImageUrl = null;
      document.getElementById('imgPreviewBar').classList.add('hidden');
    };
  </script>
</body>
</html>
