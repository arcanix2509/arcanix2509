<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Arcanix Hub - Global Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    #chatMessages::-webkit-scrollbar {
      width: 4px;
    }
    #chatMessages::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.2);
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-[100dvh] flex flex-col font-sans antialiased overflow-hidden pb-16 sm:pb-0">

  <!-- Navbar -->
  <nav class="border-b border-slate-800/80 bg-slate-900/90 backdrop-blur-md sticky top-0 z-40 px-4 sm:px-6 py-3 flex justify-between items-center shrink-0">
    <div class="flex items-center space-x-3">
      <a href="dashboard.html" class="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center font-black text-lg shadow-lg shadow-cyan-500/20">A</a>
      <div>
        <h1 class="font-black text-base sm:text-lg bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-purple-400">GLOBAL CHAT</h1>
        <p class="text-[10px] text-slate-400 -mt-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block animate-pulse"></span> Live Network</p>
      </div>
    </div>

    <!-- Desktop Navigation -->
    <div class="hidden sm:flex items-center gap-6 text-sm font-semibold text-slate-400">
      <a href="dashboard.html" class="hover:text-cyan-400 transition">Worlds</a>
      <a href="chat.html" class="text-cyan-400 border-b-2 border-cyan-400 pb-1">Global Chat</a>
      <a href="profile.html" class="hover:text-cyan-400 transition">Profile</a>
    </div>
  </nav>

  <!-- Chat Container -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-3 sm:p-6 flex flex-col justify-between overflow-hidden relative">
    
    <!-- Messages Scrollable Box -->
    <div id="chatMessages" class="flex-1 overflow-y-auto space-y-3 pr-1 pb-4 flex flex-col">
      <div class="text-center text-xs text-slate-500 py-4">
        Connecting to global chat stream...
      </div>
    </div>

    <!-- Message Input Bar -->
    <form id="chatForm" class="mt-2 flex items-center gap-2 bg-slate-900/90 border border-slate-800 p-1.5 sm:p-2 rounded-2xl backdrop-blur-xl shadow-lg shrink-0">
      <input type="text" id="messageInput" placeholder="Write a message..." required autocomplete="off"
             class="flex-1 bg-transparent px-4 py-2 sm:py-2.5 text-xs sm:text-sm text-white placeholder-slate-500 focus:outline-none">
      <button type="submit" class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 hover:opacity-90 text-slate-950 flex items-center justify-center transition active:scale-95 shrink-0">
        <i class="fa-solid fa-paper-plane text-sm"></i>
      </button>
    </form>

  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <div class="sm:hidden fixed bottom-0 left-0 right-0 bg-slate-900/95 border-t border-slate-800 backdrop-blur-xl z-40 flex justify-around p-2">
    <a href="dashboard.html" class="flex flex-col items-center py-1 text-slate-400">
      <i class="fa-solid fa-gamepad text-base"></i>
      <span class="text-[10px] mt-0.5">Worlds</span>
    </a>
    <a href="chat.html" class="flex flex-col items-center py-1 text-cyan-400 font-bold">
      <i class="fa-solid fa-comments text-base"></i>
      <span class="text-[10px] mt-0.5">Chat</span>
    </a>
    <a href="profile.html" class="flex flex-col items-center py-1 text-slate-400">
      <i class="fa-solid fa-user text-base"></i>
      <span class="text-[10px] mt-0.5">Profile</span>
    </a>
  </div>

  <script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const chatMessages = document.getElementById('chatMessages');
    const chatForm = document.getElementById('chatForm');
    const messageInput = document.getElementById('messageInput');
    
    let currentUser = null;
    let userProfile = { username: 'Survivor', avatarUrl: '' };

    onAuthStateChanged(auth, (user) => {
      if (!user) return window.location.href = 'index.html';
      currentUser = user;

      // Fallback details initially
      userProfile.username = user.displayName || user.email.split('@')[0];
      userProfile.avatarUrl = user.photoURL || `https://api.dicebear.com/7.x/bottts/svg?seed=${user.uid}`;

      // 1. Fetch User Data in Background (Async - without blocking chat stream)
      getDoc(doc(db, "users", user.uid)).then((userDoc) => {
        if (userDoc.exists()) {
          const data = userDoc.data();
          if (data.username) userProfile.username = data.username;
          if (data.avatarUrl) userProfile.avatarUrl = data.avatarUrl;
        }
      }).catch(err => console.error("Error fetching profile:", err));

      // 2. Load Global Chat Messages Immediately
      const q = query(collection(db, "global_chat"), orderBy("createdAt", "asc"), limit(100));
      
      onSnapshot(q, (snapshot) => {
        chatMessages.innerHTML = '';

        if (snapshot.empty) {
          chatMessages.innerHTML = `<div class="text-center text-xs text-slate-500 my-auto">No messages yet. Say hi!</div>`;
          return;
        }

        snapshot.forEach((docSnap) => {
          const msg = docSnap.data();
          const isMe = msg.uid === currentUser.uid;

          const msgElement = document.createElement('div');
          msgElement.className = `flex gap-2 items-end ${isMe ? 'justify-end' : 'justify-start'}`;

          if (isMe) {
            // RIGHT SIDE (Logged-in User)
            msgElement.innerHTML = `
              <div class="max-w-[78%] sm:max-w-[70%] space-y-1 text-right">
                <div class="bg-gradient-to-r from-cyan-600 to-blue-600 text-white rounded-2xl rounded-br-xs px-4 py-2.5 text-xs sm:text-sm shadow-md inline-block text-left break-words">
                  ${escapeHTML(msg.text)}
                </div>
                <div class="text-[9px] text-slate-500 pr-1">You (${escapeHTML(msg.username || 'Survivor')})</div>
              </div>
            `;
          } else {
            // LEFT SIDE (Other Users)
            msgElement.innerHTML = `
              <img src="${msg.avatarUrl || 'https://api.dicebear.com/7.x/bottts/svg?seed=' + (msg.username || 'User')}" 
                   class="w-7 h-7 rounded-full border border-slate-700 bg-slate-800 shrink-0 mb-4">
              <div class="max-w-[78%] sm:max-w-[70%] space-y-1">
                <div class="text-[10px] font-bold text-slate-400 pl-1">${escapeHTML(msg.username || 'Survivor')}</div>
                <div class="bg-slate-800/90 border border-slate-700/60 text-slate-100 rounded-2xl rounded-bl-xs px-4 py-2.5 text-xs sm:text-sm shadow-md inline-block break-words">
                  ${escapeHTML(msg.text)}
                </div>
              </div>
            `;
          }

          chatMessages.appendChild(msgElement);
        });

        // Auto Scroll to Bottom
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }, (error) => {
        console.error("Chat listener error:", error);
        chatMessages.innerHTML = `<div class="text-center text-xs text-red-400 my-auto">Failed to load chat stream. Check Firestore Rules!</div>`;
      });
    });

    // Send Message Event
    chatForm.onsubmit = async (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text || !currentUser) return;

      messageInput.value = '';

      try {
        await addDoc(collection(db, "global_chat"), {
          text: text,
          uid: currentUser.uid,
          username: userProfile.username,
          avatarUrl: userProfile.avatarUrl,
          createdAt: serverTimestamp()
        });
      } catch (err) {
        console.error("Error sending message:", err);
      }
    };

    function escapeHTML(str) {
      if (!str) return '';
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
